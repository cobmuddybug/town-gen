<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Town Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <header class="bar">
    <div class="menu-wrap">
      <button type="button" id="town-menu" aria-haspopup="menu" aria-expanded="false" title="Your towns, files and settings"><span id="town-name">Town Generator</span> <span class="caret">▾</span></button>
      <div id="town-menu-list" class="pop menu" role="menu" hidden></div>
      <input type="file" id="load" accept=".json,application/json" hidden />
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search people, places, trades" autocomplete="off" spellcheck="false" aria-label="Search the town" />
      <kbd>/</kbd>
      <div id="palette" class="pop palette" hidden></div>
    </div>
    <div class="clock" id="clock">
      <button type="button" data-step="-1" aria-label="Back one block" title="Back one block  [">◀</button>
      <button type="button" id="clock-label" aria-haspopup="dialog" aria-expanded="false" title="Pick a date and time of day"></button>
      <button type="button" data-step="1" aria-label="Forward one block" title="Forward one block  ]">▶</button>
      <div id="clock-pop" class="pop" hidden>
        <label class="field"><span>Date</span><input id="clock-date" size="10" title="YYYY-MM-DD" /></label>
        <label class="field"><span>Time of day</span>
          <select id="clock-block">
            <option value="morning">morning 5–8</option>
            <option value="forenoon">forenoon 9–12</option>
            <option value="afternoon">afternoon 13–16</option>
            <option value="evening">evening 17–20</option>
            <option value="night">night 21–24</option>
            <option value="late_night">late night 1–4</option>
          </select>
        </label>
      </div>
    </div>
    <button type="button" id="player-toggle" aria-pressed="false" title="Hide the DM's secrets, for sharing the screen  (Shift+P)">Player view</button>
    <button type="button" id="new-town-btn" class="primary">New town</button>
  </header>
  <dialog id="new-town-dialog" aria-label="New town"><form id="new-town"></form></dialog>
  <main>
    <section id="map" aria-label="Map"></section>
    <aside id="inspector" aria-label="Inspector"></aside>
  </main>
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
