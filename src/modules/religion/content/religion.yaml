# The religious hierarchy (LF p.85), in our words. Dedications are saints'
# names common in medieval England; the setting may rename them.
seats:
  - { id: grand_temple, label: "cathedral", clergy: "a bishop and six canons", supports: "1,000 or more", tithes: "nobody; it receives from every church in the diocese", source: "LF p.85" }
  - { id: temple, label: "minster", clergy: "a provost and four or more clerks", supports: "600 or more", tithes: "the cathedral", source: "LF p.85" }
  - { id: fane, label: "parish church", clergy: "a priest and a clerk or two", supports: "about 300", tithes: "the minster", source: "LF p.85" }
  - { id: chapel, label: "chapel", clergy: "a chaplain and a clerk", supports: "about 150", tithes: "the minster", source: "LF p.85" }
  - { id: chantry, label: "chantry chapel", clergy: "one priest, singing for the dead, helped by friars or monks", supports: "about 100", tithes: "its religious house", source: "LF p.85" }
  - { id: shrine, label: "shrine", clergy: "one minor cleric", supports: "about 50", tithes: "the minster or the friars", source: "LF p.85" }
