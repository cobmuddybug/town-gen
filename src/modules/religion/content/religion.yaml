misdeeds:
  - "struck a carter in the street and broke his jaw"
  - "got a servant girl with child and turned her out"
  - "sold the parish's silver candlesticks and said they were stolen"
  - "took money to bury a suicide in hallowed ground"
  - "keeps a woman in a house by the river"
  - "forged a will for a fee"
  - "beat an apprentice half to death for a cheek"
  - "lends at interest, which is usury, through a merchant's name"
  - "sold indulgences that were never his to sell"
  - "pawned the chalice to a moneylender"
  - "is drunk at mass more often than not"
  - "took a bribe to marry a pair who were too near kin"
  - "stole the offerings from the saint's box"
grudges:
  - "the minster's cut, while his own parish goes without"
  - "being made to pay for the minster's new roof"
  - "a tithe of the Easter offerings he can't spare"
  - "being passed over for a richer parish"
  - "the minster's men taking the best of the tithe corn"
