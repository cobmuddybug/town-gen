    bold: ["Bold {given}", "the Cock"]
    timid: ["Mouse", "Shy {given}"]
    shrewd: ["the Magpie", "Sharp {given}"]
  any: ["Little {given}", "{given} Quick", "the Owl", "Magpie", "Shoes", "{given} the Nip", "Jack-in-the-Box", "Kit-cat", "Rook", "Crow", "Toby", "the Moth", "Sixpence", "Darkmans {given}", "Wet {given}", "Old {given}"]

# What a crew calls itself in the open: a password and a sign (our own).
words: ["darkmans", "lightmans", "ruffmans", "bene bowse", "the green cove", "Saint Dismas", "the queer cuffin's dead", "a rum mort", "glimmer", "the cly is light", "harmanbeck sleeps", "cackling cheat", "pannam and caffan", "the prancer's shod", "salmon", "lour", "the knot's fast"]
signs: ["a thumb drawn down the cheek", "two fingers laid along the nose", "a knuckle rapped twice on the table, then once", "a hat touched with the left hand", "a palm turned up and slowly closed", "the little finger crooked round a cup", "a coin turned over on the counter", "an ear pulled, as if it itched"]
emblems: ["a wheel", "a hook", "a cross in a ring", "an open hand", "a key", "a little gallows, upside down", "a crescent moon", "three strokes and a dot"]
customs:
  - "a tenth of every take to the chief, before anyone drinks"
  - "nobody works the street the den is on"
  - "a member taken by the watch keeps his mouth shut, and the crew feeds him in gaol"
  - "a nose has his tongue slit, if he's lucky"
  - "no working in the parish of the church that feeds them"
  - "new members are sworn in at night with ale poured over the head"
  - "no lifting from widows on a Sunday"
  - "the children keep a quarter of what they bring in"
  - "quarrels go to the chief, never to the watch"

