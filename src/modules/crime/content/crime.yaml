# What a crew member says to a stranger, by rank (our own lines).
openers:
  nips: ["(bumps into you, all apologies, and is gone into the crowd)", "“Mind your step, master, the cobbles are cruel.” (a hand is near your belt)", "“Lost, are you? I know a short way through.”"]
  crackers: ["“Fine house, that one. Wonder who lives there.”", "(is studying the shutters across the lane, and looks away when you see)", "“Anything heavy to carry? I'll do it for a penny.”"]
  pads: ["“Late to be walking, friends. Dark lanes hereabout.”", "(steps out of a doorway, sees how many of you there are, and steps back in)", "“Spare a penny for an old soldier? No? Pity.”"]
  mumpers: ["“Alms, for the love of God, for a poor man maimed in the wars!”", "(rolls up a sleeve to show a weeping sore, very carefully)", "“A penny, master, and I'll pray for you at every church in the town.”"]
  cheats: ["“Strangers! You'll take a cup with me. There's a friendly game in the back room, small stakes.”", "“My cousin's at the dice in there, losing his shirt. Come and see the fun.”", "“You look like men of the world. Do you play?”"]
  stews: ["“Tired from the road? There's a bathhouse round the corner with very warm water.”", "(smiles from a doorway, and nods towards the stair)", "“Looking for company, sirs? I know a quiet house.”"]
  owlers: ["“You didn't see a boat. Nobody saw a boat.”", "“Wool? What wool? I'm a carter.”", "(tips his hat and keeps on walking, quickly)"]
  clippers: ["“Change your silver, master? Good weight, good weight.”", "“Fine coin you have there. I'll give you a fair rate for it.”", "(weighs a penny in his palm without seeming to)"]
  bullies: ["“Strangers in this street pay their way. Ask anyone.”", "“Nice shop, that. Shame if anything happened to it.”", "(blocks the lane, arms folded, and smiles)"]
  prancers: ["“Fine horse. Where are you stabling him tonight?”", "“Want a horse? I can get you a horse. Don't ask where.”", "(runs a hand down your horse's leg, admiringly)"]
  boss: ["“I hear you've come to town. I make it my business to hear things.”", "“Sit, sit. Have a drink on me. We should be friends, you and I.”"]
  fence: ["“Anything to sell? I buy anything, no questions. Well, small questions.”", "“I deal in second-hand goods, master. Very second-hand.”"]
  knife: ["“Good day.” (and nothing in the eyes at all)", "“Strangers? I keep myself to myself, and I advise the same.”"]
  thiefTaker: ["“Strangers, eh? I'll be keeping an eye on you. I keep an eye on everyone.”", "“If anything goes missing while you're here, I'll know where to look first.”"]

# The tellings of crimes as talk: the truth, grown, and the wrong person.
# {a} victim, {c} an innocent neighbour who gets the blame, {items}, {loot},
# {where}, {crew} the crew's name, {who} the culprit (arrests only), {fate}.
talk:
  cutpurse:
    - "{a} had a purse cut in the market, with {loot} in it"
    - "{a} had a purse cut in the market, with {more} in it, the way it's told now"
    - "{c} was standing right next to {a} when the purse went, they say"
  pickpocket:
    - "{a}'s pocket was picked, {loot} gone"
    - "{a} lost {more} to a gang of children, in broad daylight"
    - "{c} was close by when {a}'s pocket was picked, and has new shoes"
  burglary:
    - "{a}'s house was broken into in the night: {items} taken"
    - "{a}'s house was broken into in the night, and the family slept through it all, or say they did"
    - "it was {c} who broke into {a}'s house, they say; who else knew where things were kept?"
  robbery:
    - "{a} was knocked down and robbed after dark: {items}"
    - "{a} was set on by three men in the dark and robbed of {more}, they say"
    - "{c} was seen loitering in the lane where {a} was robbed"
  dice:
    - "{a} lost {loot} at dice at {where}, to strangers"
    - "{a} lost the house and the horse at dice, near enough"
    - "{c} was in on the dicing that fleeced {a}"
  crossbite:
    - "{a} was robbed at the stews, and can't very well complain to the watch"
    - "{a} was caught at the stews by a woman's 'husband' and paid {loot} to keep it quiet"
    - "{c} was seen coming out of the stews the same night"
  smuggle:
    - "lights on the water at night: owlers running wool past the customs"
    - "a whole ship's load went out under the customs' noses"
    - "{c} has more money than a carter ought to have"
  coin:
    - "clipped pennies are turning up in the market; the money-changers weigh everything now"
    - "half the silver in town is clipped, and the king's men are coming"
    - "{c} paid for bread in pennies so light they floated"
  smash:
    - "{a}'s shop was smashed up in the night"
    - "{a}'s shop was smashed up in the night and a warning chalked on the door"
    - "{c} smashed up {a}'s shop over an old grudge, they say"
  horse:
    - "a horse was taken from the stables at {where} in the night"
    - "three horses were taken from {where} and nobody heard a thing"
    - "{c} has a horse nobody can account for"
  linen:
    - "{a}'s washing went off the hedge"
    - "{a}'s washing went off the hedge, and the hens with it"
    - "{c} has been wearing a shirt very like one of {a}'s"
  killing:
    - "{a} is dead: {death}"
    - "{a} is dead, and it was no accident, whatever the coroner says"
    - "{c} had cause to want {a} dead, people are saying"
  arrest:
    - "{who} was taken by the watch for {crime}"
    - "{who} was taken by the watch for {crime}, and half the gang besides"
    - "{who} was taken by the watch for {crime}; or {c} was, depending who's telling it"
  sentence:
    - "{who}, for {crime}: {fate}"
    - "{who}, for {crime}: {fate}; and the whole town turned out to see it"
    - "{who}, for {crime}: {fate}"

# {more} is the loot as it's told a week later: three or four times over.
# Secret ties between people, as talk when they come out. Same shape as
# gossip's topics: {a} from, {b} to, {c} the wrong person, {about}.
topics:
  in_gang:
    leak: 0.06
    tellings:
      - "{a} runs with {b}"
      - "{a} is one of the worst of {b}"
      - "{c} runs with {b}"
  fence_for:
    leak: 0.12
    tellings:
      - "{a} buys stolen goods from {b}'s crew"
      - "{a}'s back room is full of other people's things"
      - "{c} buys stolen goods"
  harbours:
    leak: 0.1
    tellings:
      - "{a} lets {b}'s crew meet in the back room"
      - "{a} hides thieves from the watch"
      - "{c} hides thieves from the watch"
  pays_off:
    leak: 0.3
    tellings:
      - "{b} takes money from {a} to look the other way"
      - "{b} is in the pay of every thief in the ward"
      - "{c} takes money to look the other way"
  protection:
    leak: 0.25
    tellings:
      - "{a} pays {b} every week, and it isn't for nothing"
      - "every shop in the street pays {b}, and {a} pays double"
      - "{c} pays {b} every week"
  informs_on:
    leak: 0.2
    tellings:
      - "{a} is a nose: tells {b} everything"
      - "{a} has sold half the town's thieves to {b}"
      - "{c} is a nose, tells the watch everything"
  blackmails:
    leak: 0.3
    tellings:
      - "{a} has something on {b}, and {b} is paying"
      - "{a} has been bleeding {b} dry for a year"
      - "{c} has something on {b}"
  tithe_to:
    leak: 0.05
    tellings:
      - "{a} pays a tenth of the take to {b}"
      - "{b} is the real master of every thief in town"
      - "{c} pays a tenth of the take to {b}"
  hired_knife:
    leak: 0.4
    tellings:
      - "{a} paid {b} to have someone killed"
      - "{a} has paid to have more than one person killed"
      - "{c} paid to have someone killed"
