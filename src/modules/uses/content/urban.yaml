# Building uses for big villages, towns and cities (LF pp.10-11, 83-104).
#
# `per`: about one per this many inhabitants (our own figures, cross-checked
#   against the shape of S. John Ross's Medieval Demographics Made Easy, not
#   copied from it). Villages get half as many. `min_pop`: none below this.
# `value`: the ward value classes the use suits, 0 slum .. 8 prestige
#   commercial (LF Table 2:20). `site`: the street front it wants (market,
#   main_road, street, lane, quay, suburb, edge) or a special place (church,
#   precinct, castle, gate, stream, downstream, river, market_place).
# `plots`: frontage it takes, in plots. `households` may be a range.
# `look`: how the map colours it. `cluster`: copies keep together (the
#   shambles, the mercery, goldsmiths' row); everything else spreads out.

