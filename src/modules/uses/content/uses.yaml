# Building uses. `size` is the footprint class the layout gives the building.
# `site` asks the layout for a particular spot. `households` is how many
# households live under the roof. `occupations` are weighted choices for the
# head of each household (the first household is the business's master).
# Categories follow LF pp.10-11.
# `avgSize`: people under the roof on average, measured from generated towns (not
# guessed); the plan divides the target population by it, so keep it honest.
- id: farmhouse
  label: farmhouse
  avgSize: 4.5
  category: small_rural
  size: farm
  households: 1
  occupations: { large_tenant_farmer: 2, tenant_farmer: 5, small_farmer: 3 }
  source: "LF pp.72-73"
- id: cottage
  label: cottage
  avgSize: 3.8
  category: small_rural
  size: cottage
  households: 1
  occupations: { labourer: 6, herdsman: 2, ploughman: 2, widow_spinster: 2, carter: 1 }
  source: "LF pp.72-73"
