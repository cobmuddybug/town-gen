# Material conditions by tier, for country households. The schema follows
# LF Tables 2:2-2:16; the wording and the choices are ours.
# Each field is a list; one entry is drawn per household.
- id: upper_middle
  source: "LF Tables 2:5-2:7"
  dwelling: ["a hall house of several bays, with a solar and a kitchen apart", "a stone house with a hall, chambers above and a walled court"]
  light: ["wax candles in the chamber, tallow below", "candles, and a lantern for the yard"]
  heat: ["a wall fireplace with a chimney", "a great hearth and a brazier in the solar"]
  cooking: ["a kitchen of its own, with a cook", "a detached kitchen to keep fire from the hall"]
  water: ["its own well in the court"]
  diet: ["white bread, fresh meat most days, fish on fast days, spices bought in town"]
  drink: ["wine for guests, good ale for the house"]
  dress: ["dyed wool and linen, fur-trimmed for best"]
  arms: ["a sword, worn when travelling", "a sword and a hunting spear"]
  bedding: ["a bedstead with curtains, feather mattress and linen sheets"]
- id: middle_middle
