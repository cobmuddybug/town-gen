  light: ["tallow candles; a wax candle on holy days", "tallow candles and a horn lantern"]
  heat: ["an open hearth in the hall", "a hearth with a smoke hood"]
  cooking: ["its own hearth, with a maid to tend it", "its own hearth and an oven in the yard"]
  water: ["its own well", "a share of the common well, and water from the stream for washing"]
  diet: ["wheat bread, pottage, bacon and fowl, meat a few times a week", "good maslin bread, cheese, salt pork, fish on Fridays"]
  drink: ["ale brewed at home, and bought ale when the brew runs out", "ale, and a little wine at feasts"]
  dress: ["good undyed wool, a dyed hood for Sundays", "wool and linen, one good gown kept in a chest"]
  arms: ["a sword kept over the hearth, and a good knife", "a falchion and a cudgel"]
  bedding: ["a bedstead with a flock mattress and woollen blankets"]
  display: ["one room done up well above their station, with a painted cloth on the wall", null, null]
