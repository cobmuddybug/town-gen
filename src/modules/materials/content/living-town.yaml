  source: "LF Tables 2:13-2:14"
  dwelling: ["a shed against the town wall", "a doorway by the church, out of the wind", "a bench in a sleeping house, when there's a penny for it"]
  light: ["none"]
  heat: ["none"]
  cooking: ["none"]
  water: ["the river"]
  diet: ["what is given at the church door and the back of the cookshop"]
  drink: ["water"]
  dress: ["rags"]
  arms: ["nothing anyone would call a weapon"]
