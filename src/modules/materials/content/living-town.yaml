- id: "town:criminal"
  source: "LF p.65"
  dwelling: ["a cellar room nobody else will rent", "wherever is safe tonight", "rooms above a fence's shop, rent paid in kind"]
  light: ["a stolen candle"]
  heat: ["a brazier"]
  cooking: ["the cookshop, paid in coin that came from somewhere"]
  water: ["the well, at night"]
  diet: ["feast or famine, depending on the week"]
  drink: ["the best the tavern has, when there's money"]
  dress: ["better than they should be able to afford, or deliberately worse"]
  arms: ["a knife up the sleeve, and a cosh"]
  bedding: ["a good blanket, from somewhere"]
