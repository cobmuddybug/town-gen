# Material conditions by tier, for town households (LF Tables 2:2-2:16 and
# pp.83-84). Ids are `town:` plus the tier. Wording and choices are ours.
- id: "town:upper_upper"
  source: "LF Tables 2:2-2:3"
  dwelling: ["a palace of stone round two courts, with a chapel, a great hall and gardens"]
  light: ["wax candles everywhere, and torches in the courts"]
  heat: ["fireplaces in every chamber"]
  cooking: ["great kitchens and a household of cooks"]
  water: ["piped to its own cistern"]
  diet: ["whatever can be had, and spices from the far side of the world"]
  drink: ["the best wines, by the tun"]
  dress: ["silk, velvet and fur; near-astonishing"]
  arms: ["a jewelled sword, and men to carry the rest"]
  bedding: ["a great bed hung with silk"]
- id: "town:middle_upper"
  source: "LF Tables 2:3-2:4"
  dwelling: ["a great stone house round a court, with a hall, chapel and stables"]
  light: ["wax candles, and torches in the court"]
  heat: ["fireplaces in the hall and the great chamber"]
  cooking: ["a kitchen range with a cook and scullions"]
  water: ["its own well in the court, and water carried in"]
  diet: ["white bread, meat and fowl every day, spiced sauces, sweetmeats"]
  drink: ["good wine, and ale for the household"]
  dress: ["fine wool and silk, fur linings; modish"]
  arms: ["a sword, and armour kept polished"]
  bedding: ["a curtained bed with feather mattresses and linen"]
- id: "town:lower_upper"
  source: "LF Table 2:4"
  dwelling: ["a stone house on the best street, with a hall, chambers, a court and stabling"]
  light: ["wax candles in the chambers, tallow for the servants"]
  heat: ["fireplaces with chimneys"]
  cooking: ["a kitchen of its own, with a cook"]
  water: ["its own well in the court"]
  diet: ["white bread, fresh meat most days, fish on fast days, spices"]
  drink: ["wine at every meal"]
  dress: ["dyed wool and silk trimmings, furred; modish or traditional as suits"]
  arms: ["a sword, always"]
  bedding: ["a curtained bed, feather mattress, linen sheets"]
- id: "town:upper_middle"
  source: "LF Tables 2:5-2:7"
  dwelling: ["a tall house on a good street: the counting-house or shop below, hall and chambers on three floors above, a court and warehouse behind", "a stone undercroft with a timbered house of three storeys over it, and a garden behind"]
  light: ["wax candles in the hall, tallow below stairs"]
  heat: ["a chimneyed fireplace in the hall and the best chamber"]
  cooking: ["a kitchen in the yard, with a cook"]
  water: ["its own well in the yard", "a water carrier who comes every morning"]
  diet: ["white bread from the baker, fresh meat most days, fish on fast days, spices from the spicer"]
  drink: ["wine for the table, good ale for the household"]
  dress: ["fine dyed wool, a furred gown; modish, to be seen in"]
  arms: ["a sword, worn in the street, which the law allows", "a sword and a buckler"]
  bedding: ["a curtained bed with feather mattress and linen sheets"]
  display: ["a painted chamber that cost more than the house", "glass in the hall windows, which everyone remarks on", null]
- id: "town:middle_middle"
  source: "LF Tables 2:8-2:9"
  dwelling: ["its own house: the shop on the street, hall and chambers above, a yard behind; six to ten rooms", "a house of two storeys over the workshop, with a jettied front"]
  light: ["tallow candles, and a wax candle on holy days"]
  heat: ["a hearth with a chimney in the hall", "an open hearth and a brazier in the chamber"]
  cooking: ["its own hearth, with a maid to tend it"]
  water: ["the well at the street corner, carried by the maid", "a water carrier, twice a week"]
  diet: ["wheat bread, pottage, meat a few times a week, a pie from the cookshop on market days"]
  drink: ["bought ale, and wine at feasts"]
  dress: ["good dyed wool, one modish gown for the guild feast"]
  arms: ["a sword kept in the chest, and a good knife at the belt"]
  bedding: ["a bedstead with a flock mattress and woollen blankets"]
  display: ["one room done up well above their station, with a painted cloth and a carved chair", null, null]
- id: "town:lower_middle"
  source: "LF Tables 2:9-2:10"
  dwelling: ["a narrow house, the shop below and two rooms above", "rooms over another man's shop, and the use of his yard"]
  light: ["tallow candles, sparingly"]
  heat: ["an open hearth, smoke out through a louvre"]
  cooking: ["its own hearth, and the common bakehouse for bread", "a small hearth; the big dishes go to the cookshop"]
  water: ["the well at the street corner", "a water carrier, a penny a bucket"]
  diet: ["bought bread, pottage, cheese, salt fish, meat on Sundays"]
  drink: ["ale from the alehouse"]
  dress: ["sound wool, a hood dyed for Sundays; traditional"]
  arms: ["a long knife; a sword only if nobody is looking"]
  bedding: ["a flock mattress on a bedstead"]
  display: ["a pewter dish on the shelf where the street can see it", null, null]
- id: "town:upper_lower"
  source: "LF Tables 2:10-2:11"
  dwelling: ["two rented rooms: a front chamber and a loft", "rented quarters at the back of a tenement"]
  light: ["rushlights", "the fire, and a rushlight"]
  heat: ["a small hearth shared with the next room", "a brazier"]
  cooking: ["no hearth fit for cooking: the pot goes to the cookshop, the dough to the bakehouse"]
  water: ["the street well, and a long queue"]
  diet: ["bought bread, pottage from the cookshop, herrings, onions"]
  drink: ["small ale, and the alehouse on Saturdays"]
  dress: ["undyed wool, patched; shoes"]
  arms: ["a knife, and a cudgel by the door"]
  bedding: ["a straw mattress on the floor, two blankets"]
- id: "town:middle_lower"
  source: "LF Tables 2:11-2:12"
  dwelling: ["a rented room and a share of the loft", "one room over a stable"]
  light: ["the fire, mostly"]
  heat: ["a brazier, when there's charcoal"]
  cooking: ["none: food comes from the cookshop or not at all"]
  water: ["the street well", "the river, which is not wise"]
  diet: ["coarse bread, pease pottage from the cookshop, whatever's cheap"]
  drink: ["small ale and water"]
  dress: ["undyed wool, much mended; bare feet in summer"]
  arms: ["a knife"]
  bedding: ["a straw tick shared with others"]
- id: "town:lower_lower"
  source: "LF Tables 2:12-2:13"
  dwelling: ["one room in a tenement, shared with another family", "a corner of a crowded room by the river"]
  light: ["none to speak of"]
  heat: ["other people's warmth"]
  cooking: ["none; bread and the cookshop's cheapest"]
  water: ["the river, or the well when nobody chases them off"]
  diet: ["coarse bread, onions, scraps, and hunger before pay day"]
  drink: ["water, and the dregs at the alehouse"]
  dress: ["rags over a smock; no shoes"]
  arms: ["a knife, hidden"]
  bedding: ["straw on the floor"]
