# What a DM needs to play a person: what they want and fear, how they talk,
# what they're good at, how they take to strangers. All our own; no book source.
# Rows: text, weight, and optional conditions as in people/history.yaml:
# minAge, maxAge, sex, roles, occ (the person's or household's trade), minRank,
# maxRank, setting (country or town), bases (the settlement's economy).
# `clash` lists things that can't stand beside this line, as field:id
# (want, fear, speech, habit, knack, strangers, faith, health, trait).
# A clash is checked both ways, so it needs writing on one side only.
# {they}/{their}/{them}/{themself} are pronouns and {verb} agrees with them.
# Write wants as "to ..." or a noun phrase and fears as a noun phrase.
# Babies (under 3) get no want, fear or speech; `babes` gives them a temper.

