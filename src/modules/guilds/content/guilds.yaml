# The merchant guild is a different thing: a brotherhood of traders that
# keeps the town's trade to itself, not a craft with masters and journeymen.
merchant_rules:
  - "no stranger to buy or sell in the town but through a brother of the guild"
  - "brothers go toll-free in the market, and buy first when a ship or a wagon comes in"
  - "any brother present at a bargain may claim a share in it, at the same price"
  - "brothers at law with each other go first before the alderman, not the court"
  - "every brother pays scot and lot with the town, and keeps a horse and arms for its defence"
  - "a brother fallen into poverty is kept by the guild, and his daughter dowered"
merchant_charity:
  - "keeps a chaplain to sing for dead brothers, and the guild's lights before the altar"
  - "pays for the bridge and the town's wall when the king's tax falls due"
  - "gives a feast for the whole town once a year, and a dole of bread to the poor"
