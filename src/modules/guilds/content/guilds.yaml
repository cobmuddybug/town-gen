# Guilds (LF p.85), in our words. `names` are the guilds' own names for the
# guild ids used by occupations; `rights` are the demarcation quarrels.
names:
  merchants: "the Merchant Guild"
  mercers: "the Mercers' Company"
  drapers: "the Drapers' Company"
  grocers: "the Grocers' Company"
  vintners: "the Vintners' Company"
  goldsmiths: "the Goldsmiths' Company"
  butchers: "the Butchers' Guild"
  fishmongers: "the Fishmongers' Guild"
  brewers: "the Brewers' Guild"
  fullers: "the Fullers' Guild"
  dyers: "the Dyers' Guild"
  tailors: "the Tailors' Guild"
  cappers: "the Cappers' Guild"
  glovers: "the Glovers' Guild"
  skinners: "the Skinners' Guild"
  cordwainers: "the Cordwainers' Guild"
  cutlers: "the Cutlers' Guild"
  armourers: "the Armourers' Guild"
  smiths: "the Smiths' Guild"
  pewterers: "the Pewterers' Guild"
  bowyers: "the Bowyers' and Fletchers' Guild"
  carpenters: "the Carpenters' Guild"
  tilers: "the Tilers' and Plasterers' Guild"
  glaziers: "the Glaziers' Guild"
  saddlers: "the Saddlers' Guild"
  leathersellers: "the Leathersellers' Guild"
  scriveners: "the Scriveners' Guild"
  barbers: "the Barbers' Guild"
  painters: "the Painters' and Stainers' Guild"
  weavers: "the Weavers' Guild"
  bakers: "the Bakers' Guild"
  masons: "the Masons' Guild"
  coopers: "the Coopers' Guild"
  chandlers: "the Chandlers' Guild"
# Occupations from the country tables that join a guild in town.
extra_members: { weaver: weavers, baker: bakers, mason: masons, cooper: coopers, chandler: chandlers, carpenter: carpenters, smith: smiths, tanner: leathersellers }
rules:
  - "no work by candlelight, when bad work can be hidden"
  - "no master to keep more than two apprentices"
  - "no outsider to sell in the town but on market days"
  - "every piece to bear its maker's mark"
  - "a fixed price for common work, which nobody may undercut"
  - "no master to entice away another's servant or journeyman"
  - "seven years' apprenticeship before a man may be a journeyman"
  - "no work on a saint's day, on pain of a fine in wax"
  - "every member to come to the funeral of every other"
  - "no master to sell out of his own window after the curfew bell"
  - "a fine for any master who speaks ill of the guild in a tavern"
charity:
  - "pays for members' funerals, and keeps their widows from the street"
  - "keeps a box for members fallen sick, and a candle burning before its saint"
  - "pays a priest to sing for dead members, and feeds the poor on its feast day"
  - "keeps a bed in the hospital for members fallen on hard times"
  - "pays to mend the bridge every few years, and puts its arms on it"
rights:
  - { a: cordwainers, b: cobbler, text: "new shoes made by the cobblers, which is the cordwainers' right", says: "the cobblers are making new shoes, which is the cordwainers' right" }
  - { a: tailors, b: fripperer, text: "new cloth cut by the old-clothes men, which is the tailors' right", says: "the old-clothes men are cutting new cloth, which is the tailors' right" }
  - { a: drapers, b: tailors, text: "cloth sold by the yard in the tailors' shops, which is the drapers' right", says: "the tailors are selling cloth by the yard, which is the drapers' right" }
  - { a: smiths, b: cutlers, text: "blades forged by the smiths, which the cutlers say is their work alone", says: "the smiths are forging blades, which the cutlers say is theirs alone" }
  - { a: carpenters, b: coopers, text: "barrels made by the carpenters, which is coopers' work", says: "the carpenters are making barrels, and the coopers have noticed" }
  - { a: grocers, b: spicer, text: "spices sold by the pound at the apothecary's, which the grocers say is their trade", says: "the apothecaries are selling spices by the pound, which the grocers say is theirs" }
  - { a: mercers, b: drapers, text: "silk sold over the drapers' counters", says: "the drapers have started selling silk" }
  - { a: merchants, b: weavers, text: "cloth sold by retail from the weavers' own doors, which the merchants say is theirs alone", says: "the weavers are selling their own cloth by the yard, past the merchants" }
  - { a: merchants, b: tailors, text: "a cargo of foreign cloth that the tailors bought direct from a stranger", says: "the tailors bought foreign cloth from a stranger, past the guild" }
