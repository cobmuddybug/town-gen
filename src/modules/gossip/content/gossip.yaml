# How talk travels (LF pp.76, 93), in our words. Each topic has three
# tellings: the truth, the truth grown in the telling, and the truth with the
# wrong person in it. {a} and {b} are the people in it, {c} is a neighbour of
# {a} who had nothing to do with it, {amount} a sum, {about} the reason.

# How likely a secret is to come out at all in the ten years from 1203, by edge kind.
leak:
  lover: 0.85
  debtor_of: 0.45
  grievance: 0.55
  courting: 0.9
  skims: 0.6
  default: 0.35
# How many hours a thing stays the talk of the place.
fade: { secret: 300, news: 80, official: 120 }
# How it got out.
how:
  - "a servant talked"
  - "someone saw, and told one person in confidence"
  - "it came out in a quarrel, shouted in the street"
  - "a child repeated something at the well"
  - "it was let slip over a third cup of ale"
  - "a neighbour heard through the wall"
  - "a letter was read by the wrong person"
  - "the one who knew couldn't keep it in"
  - "the priest's housekeeper heard it at confession's door"
  - "it was seen from an upper window"
  - "a pedlar carried it from the next village and back again"
  - "a drunk said it out loud at the wrong moment"
topics:
  lover:
    - "{a} and {b} have been meeting in secret"
    - "{a} and {b} have been lovers for a year or more, and everyone but their own families knew"
    - "{c} and {b} have been meeting in secret"
  debtor_of:
    - "{a} owes {b} {amount} and can't pay it"
    - "{a} owes {b} twice what anybody thought, and is selling things off"
    - "{c} owes {b} money and can't pay it"
  grievance:
    - "{a} has it in for {b}, over {about}"
    - "{a} has sworn to see {b} ruined, over {about}"
    - "{c} has it in for {b}"
  courting:
    - "{a} is courting {b}"
    - "{a} and {b} are as good as married already"
    - "{c} is courting {b}"
  skims:
    - "{a} is skimming from the lord, and {b} looks the other way"
    - "{a} has been robbing the lord for years, and {b} takes a share"
    - "{c} is skimming from the lord"
  misdeed:
    - "{a} {about}"
    - "{a} {about}, and worse besides"
    - "{c} {about}"
  default:
    - "something between {a} and {b} that they'd rather nobody knew"
    - "something ugly between {a} and {b}"
    - "something between {c} and {b}"
# News that comes with visitors. {who} and {note} come from the visit.
news:
  tax: "the sheriff's man is in town ({note})"
  herald: "a herald in the market, proclaiming {note}"
  players: "players have come: {who}, {note}"
  mountebank: "a mountebank's train is in: {who}, with {note}"
  band: "{who} are here, {note}"
  tinkers: "{who} are about, {note}"
  thefts: "thieves in the night: {note}"
  friar: "{who} is here to say mass"
  fair: "everyone is talking about {who}"
  assize: "the assizes: {who} is come, and the gaol will be emptied one way or another"
  bailiff: "the bailiff is in: {note}"
  manor_court: "the manor court sits: {note}"
  default: "{who}: {note}"
# Ballads: a story big enough gets a song in the town's taverns, names changed.
ballads:
  - "a ballad singer has a song about it in the taverns, with the names changed and nobody fooled"
  - "the apprentices have a rhyme about it"
  - "there's a song going round about it, sung to an old tune"
  - "the children have a skipping rhyme about it"
  - "the players at the inn worked it into their play, to roars"
# Chatter: what everyone already knows, brought up again. One or two things
# every few days, by edge kind; each kind has a few ways of being said.
chatter:
  rival:
    - "{a} and {b} are at it again, over {about}"
    - "{a} won't drink in the same room as {b} since the business over {about}"
    - "{a} has been telling anyone who'll listen what {b} did over {about}"
  dispute:
    - "the quarrel between {a} and {b}, over {about}, is no nearer settled"
    - "{a} and {b} have taken the business of {about} to {court} again"
    - "{a} and {b} still can't agree about {about}, and the whole place has taken sides"
  betrothed:
    - "{a} and {b} are to be married; the banns are read on Sunday"
    - "{a} and {b} were seen walking out after church, and the wedding's to be soon"
  debtor_of:
    - "{a} still owes {b} {amount}, and {b} has started saying so in public"
    - "{b} has been round to {a}'s door again about the {amount}"
    - "{a} crossed the road to keep clear of {b}, and everyone knows it's the {amount}"
  grievance:
    - "{a} is still complaining about {b}: {about}"
    - "{a} brought up {about} against {b} again, and nobody wants to hear it"
  apprentice_of:
    - "{a} has been beaten again by {b}, the master, they say"
    - "{a} was sent home in tears by {b}, the master, and the mother is furious"
  friend:
    - "{a} and {b} are thick as thieves these days, and nobody can think why"
    - "{a} and {b} were up half the night together at the alehouse again"
    - "{a} has been helping {b} with the work, and won't take a penny for it"
# How old talk changes as it goes round: worse, or the other way about.
retold:
  grown:
    - "; and worse, they say"
    - ", and it's come to blows once already"
    - "; the whole street has an opinion"
    - ", and the priest has had to speak to them"
  turned:
    - ", though that's not how the other side tells it"
    - ", or the other way round, depending who you ask"
    - ", though some say it's all the other one's doing"
# How a person tells what they've heard, by temper. The first that fits.
voices:
  gossip: ["You didn't hear it from me, but ", "Have you heard? ", "Well! "]
  pious: ["God forgive them, but ", "It's not for me to judge, but ", "The Lord sees all, and "]
  drinker: ["Here's one for you: ", "Buy me another and I'll tell you: "]
  sharp_tongued: ["Serves them right, but ", "Nobody's surprised: "]
  kindly: ["Poor souls: ", "I'm sorry to say it, but "]
  suspicious: ["Mark my words, there's more to it: ", "They'll tell you otherwise, but "]
  boastful: ["I knew before anyone: ", "I said so a month ago: "]
  quiet: ["(after a long pause) ", "(quietly) "]
  timid: ["(glancing round first) ", "(in a whisper) "]
  envious: ["Not before time: ", "And them so high and mighty: "]
  default: ["They say ", "I heard ", "People are saying "]
