# Prices, in pence, for a fair harvest in an ordinary month; and what each
# shop keeps on its board. Medieval English price levels, roughly, in our own
# round numbers: a labourer earns about a penny or two a day.
# `food` items follow the harvest; `season` items follow the month; `needs`
# lists the buildings that sell it, so a hamlet isn't offered a bathhouse.
prices:
  - { id: loaf, label: "a farthing loaf", price: 0.25, food: true, note: "{oz} oz by the assize of bread" }
  - { id: ale, label: "a gallon of ale", price: 1, food: true }
  - { id: wine, label: "a pint of Gascon wine", price: 1.5, needs: [tavern, wine_merchant, inn] }
  - { id: meal, label: "a hot pie at the cookshop", price: 0.5, food: true, needs: [cookshop] }
  - { id: herring, label: "a dozen salt herring", price: 1 }
  - { id: hen, label: "a hen", price: 1.5, food: true }
  - { id: goose, label: "a goose", price: 4, food: true, season: [9, 10, 11, 12] }
  - { id: eggs, label: "a score of eggs", price: 1, food: true }
  - { id: cheese, label: "a pound of cheese", price: 0.5, food: true }
  - { id: candles, label: "a pound of tallow candles", price: 1.5 }
  - { id: salt, label: "a bushel of salt", price: 6 }
  - { id: shoes, label: "a pair of shoes", price: 6 }
  - { id: cloak, label: "a plain woollen cloak", price: 36 }
  - { id: knife, label: "a good knife", price: 4 }
  - { id: horse, label: "a sound riding horse", price: 240 }
  - { id: meal_home, label: "a meal at somebody's table, if they'll have you", price: 0.5, food: true, hamlet: true }
  - { id: stabling, label: "a night's stabling and hay", price: 1.5, needs: [inn, livery_stable] }
  - { id: wage, label: "a day labourer's wage", price: 1.5 }
  - { id: letter, label: "a letter written by a clerk", price: 2, needs: [scrivener, notary] }
  - { id: shave, label: "a shave at the barber's", price: 0.5, needs: [barber] }
  - { id: bath, label: "a bath at the bathhouse", price: 1, needs: [bathhouse] }
harvest:
  - { id: good, label: "a good harvest: bread is cheap and plentiful", mult: 0.75, weight: 3 }
  - { id: fair, label: "a fair harvest: prices as usual", mult: 1, weight: 5 }
  - { id: poor, label: "a poor harvest: bread dear by spring, and tempers short", mult: 1.5, weight: 2 }
  - { id: failed, label: "the harvest failed: bread at twice its price and the poor eating bran", mult: 2.2, weight: 0.6 }
